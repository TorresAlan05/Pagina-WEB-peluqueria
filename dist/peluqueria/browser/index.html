    <!-- Aplica el tema guardado antes de pintar (evita el parpadeo) -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('tema-peluqueria'); } catch (e) {}
        if (t !== 'claro' && t !== 'oscuro') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro';
        }
        document.documentElement.setAttribute('data-theme', t === 'claro' ? 'light' : 'dark');
      })();
    </script>

    <!-- Tailwind: los grises y el blanco salen de variables, así cambian con el tema -->
