<!doctype html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Peluquería de Mati y Alan</title>

    <!-- Aplica el tema guardado antes de pintar (evita el parpadeo) -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('tema-peluqueria'); } catch (e) {}
        if (t !== 'claro' && t !== 'oscuro') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro';
        }
        document.documentElement.setAttribute('data-theme', t === 'claro' ? 'light' : 'dark');
      })();
    </script>

    <!-- Tailwind: los grises y el blanco salen de variables, así cambian con el tema -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              white: 'rgb(var(--white) / <alpha-value>)',
              neutral: {
                50: 'rgb(var(--n-50) / <alpha-value>)',
                100: 'rgb(var(--n-100) / <alpha-value>)',
                200: 'rgb(var(--n-200) / <alpha-value>)',
                300: 'rgb(var(--n-300) / <alpha-value>)',
                400: 'rgb(var(--n-400) / <alpha-value>)',
                500: 'rgb(var(--n-500) / <alpha-value>)',
                600: 'rgb(var(--n-600) / <alpha-value>)',
                700: 'rgb(var(--n-700) / <alpha-value>)',
                800: 'rgb(var(--n-800) / <alpha-value>)',
                900: 'rgb(var(--n-900) / <alpha-value>)',
                950: 'rgb(var(--n-950) / <alpha-value>)'
              }
            }
          }
        }
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
