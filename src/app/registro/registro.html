<div class="pagina-centrada">
  <div class="tarjeta tarjeta-angosta">
    <span class="sello">Mati &amp; Alan</span>
    <h2 class="titulo-tarjeta">Crear cuenta</h2>
    <p class="subtitulo">Registrate para reservar tu turno online.</p>

    <form (ngSubmit)="ClickRegistros()" class="formulario">
      <div class="fila-2">
        <div>
          <label class="etiqueta" for="nombre">Nombre</label>
          <input id="nombre" class="campo" type="text" [(ngModel)]="miRegistro.nombre" name="nombre"
                 placeholder="Nombre" autocomplete="given-name" maxlength="60" required>
        </div>
        <div>
          <label class="etiqueta" for="apellido">Apellido</label>
          <input id="apellido" class="campo" type="text" [(ngModel)]="miRegistro.apellido" name="apellido"
                 placeholder="Apellido" autocomplete="family-name" maxlength="60" required>
        </div>
      </div>
      <div>
        <label class="etiqueta" for="mail">Email</label>
        <input id="mail" class="campo" type="email" [(ngModel)]="miRegistro.mail" name="mail"
               placeholder="tu@email.com" autocomplete="email" required>
      </div>
      <div>
        <label class="etiqueta" for="contra">Contraseña</label>
        <input id="contra" class="campo" type="password" [(ngModel)]="miRegistro.contra" name="contra"
               placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
      </div>
      <div>
        <label class="etiqueta" for="contra2">Repetir contraseña</label>
        <input id="contra2" class="campo" type="password" [(ngModel)]="miRegistro.contra2" name="contra2"
               placeholder="Repetí la contraseña" autocomplete="new-password" required>
      </div>

      <button type="submit" class="btn btn-primario btn-bloque" [disabled]="cargando">
        {{ cargando ? "Registrando..." : "Registrarse" }}
      </button>
    </form>

    <p class="pie-tarjeta">¿Ya tenés cuenta? <a routerLink="/login" class="link-marca">Iniciar sesión</a></p>
  </div>
</div>
