<div class="container">
  <div class="form-box">
    <h2>Reservar Turno</h2>
    
    <form [formGroup]="formTurno" (ngSubmit)="onSubmit()" class="formulario-turno">
      
      <input type="text" formControlName="nombre" placeholder="Nombre">
   
      <input type="text" formControlName="apellido" placeholder="Apellido">

      <select formControlName="servicio">
        <option value="" disabled selected>Seleccione un servicio</option>
        <option *ngFor="let s of listaServicios" [value]="s">{{ s }}</option>
      </select>
   
      <label>Día:</label>
<input type="date" formControlName="dia" [min]="fechaMin" [max]="fechaMax">
<p *ngIf="formTurno.get('dia')?.errors?.['finDeSemana']" style="color: #e53e3e; font-size: 13px;">
  Atendemos de lunes a viernes.
</p>

<select formControlName="hora">
  <option value="" disabled>Seleccione una hora</option>
  <option *ngFor="let h of listaHoras" [value]="h" [disabled]="horaNoDisponible(h)">
    {{ h }}{{ horaNoDisponible(h) ? ' (no disponible)' : '' }}
  </option>
</select>

      <label>Observaciones (Opcional):</label>
      <textarea formControlName="observaciones"></textarea>

      <button type="submit" [disabled]="formTurno.invalid || enviando()">{{ enviando() ? 'Guardando...' : 'Agendar Turno' }}</button>
      
    </form>
  </div>
</div>
