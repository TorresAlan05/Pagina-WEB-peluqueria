<header class="border-b border-neutral-800 bg-neutral-950/80 backdrop-blur-md sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-4 py-3 min-h-20 flex flex-wrap items-center justify-between gap-3">

    <h1 class="shrink-0">
      <a routerLink="/home" fragment="sobre-nosotros" class="text-xl font-extrabold tracking-widest uppercase text-amber-500 transition hover:text-amber-400">
        Mati & Alan
      </a>
    </h1>

    <nav class="flex flex-wrap items-center gap-2">
      @if (auth.rol() === 'admin') {
        <a routerLink="/admin-dashboard" [class]="enlace">Turnos</a>
        <a routerLink="/admin-servicios" [class]="enlace">Servicios</a>
        <a routerLink="/admin-usuarios" [class]="enlace">Usuarios</a>
      } @else if (auth.rol() === 'cliente') {
        <button type="button" (click)="reservarTurno()" [class]="boton">Reservar Turno</button>
        <a routerLink="/mis-turnos" [class]="enlace">Mis Turnos</a>
      } @else {
        <a routerLink="/login" [class]="enlace">Ingresar</a>
        <button type="button" (click)="reservarTurno()" [class]="boton">Reservar Turno</button>
      }

      @if (auth.user()) {
        <span class="hidden lg:inline text-xs text-neutral-500 px-2">{{ auth.email() }}</span>
        <button type="button" (click)="cerrarSesion()" [class]="enlace">Salir</button>
      }
    </nav>
  </div>
</header>
